<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clear Output — before and after</title>
  <style>
    :root { --ink:#16332f; --muted:#52645d; --green:#0b6556; --pale:#e7f1e9; --paper:#f4f1e8; --line:#c9d5cb; --red:#983e32; }
    * { box-sizing:border-box; }
    body { margin:0; background:#dedfd8; color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,select,input { font:inherit; }
    .toolbar { max-width:1200px; margin:24px auto; padding:18px 24px; display:flex; flex-wrap:wrap; align-items:center; gap:16px; background:white; border-radius:12px; font-size:16px; }
    .toolbar label { display:flex; align-items:center; gap:8px; }
    select { padding:8px; border:1px solid var(--line); border-radius:6px; }
    .toolbar a { color:var(--green); }
    .toolbar p { flex-basis:100%; margin:0; color:var(--muted); }
    #stage { margin:auto; width:1600px; transform-origin:top center; }
    .poster { width:1600px; height:1000px; padding:52px 64px 42px; background:var(--paper); display:flex; flex-direction:column; gap:24px; overflow:hidden; }
    .brand-row { display:flex; align-items:center; justify-content:space-between; font-size:22px; font-weight:650; letter-spacing:.025em; }
    .brand { display:flex; align-items:center; gap:13px; }
    .mark { width:32px; height:32px; display:grid; grid-template-columns:repeat(3,6px); gap:4px; align-items:center; padding:3px; }
    .mark i { display:block; background:var(--green); height:10px; }
    .mark i:nth-child(2) { height:20px; }
    .mark i:nth-child(3) { height:28px; }
    .series { color:var(--muted); font-size:20px; font-weight:500; }
    h1 { margin:0; font-size:62px; font-weight:720; line-height:1.14; letter-spacing:-.045em; }
    .subtitle { margin:14px 0 0; font-size:25px; line-height:1.4; color:var(--muted); }
    .comparison { display:grid; grid-template-columns:0.8fr 1.2fr; gap:24px; flex:1; min-height:0; }
    .panel { border:1.5px solid var(--line); border-radius:20px; padding:30px; min-width:0; display:flex; flex-direction:column; }
    .before { background:#eeece3; }
    .after { background:#fffefa; border-color:#a8c3b3; }
    .panel-label { display:flex; align-items:center; gap:13px; flex-shrink:0; font-size:22px; line-height:1.2; font-weight:600; color:var(--muted); }
    .panel-label b { font-size:18px; letter-spacing:.06em; padding:7px 10px; border-radius:5px; background:#deded2; color:#47564e; }
    .after .panel-label b { background:var(--green); color:white; }
    .copy { margin:28px 0 0; font-size:29px; line-height:1.65; letter-spacing:-.012em; }
    .copy code { font-size:.88em; font-weight:650; }
    .formula { white-space:nowrap; }
    .flow { display:block; width:100%; min-height:0; flex:1; margin-top:14px; }
    .flow text { font-family:inherit; font-size:25px; fill:var(--ink); text-anchor:middle; dominant-baseline:middle; font-weight:550; }
    .flow .edge-label { font-size:20px; font-weight:550; }
    .flow .note { font-size:20px; fill:var(--muted); font-weight:450; }
    .flow .stop-label { fill:var(--red); font-size:22px; }
    .flow .white { fill:white; }
    .evidence { display:flex; flex-direction:column; justify-content:center; gap:18px; margin-top:26px; flex:1; }
    .evidence-row { border-top:1px solid var(--line); padding:20px 0 0; display:grid; grid-template-columns:156px 1fr; gap:18px; }
    .evidence-row:first-child { padding-top:0; border:0; }
    .evidence h2 { font-size:22px; font-weight:650; line-height:1.45; margin:0; color:var(--green); }
    .evidence p { font-size:28px; line-height:1.45; margin:0; }
    .evidence code { display:inline-block; background:#e7ede6; padding:4px 10px; border-radius:6px; margin-top:7px; font-size:27px; }
    .evidence .unknown { font-size:22px; color:var(--muted); margin-top:7px; }
    .explorer { margin-top:22px; display:flex; flex-direction:column; flex:1; gap:17px; min-height:0; }
    .inputs { display:grid; grid-template-columns:1fr 1fr; gap:30px; }
    .input-label { display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:23px; }
    .input-label output { font-size:25px; font-weight:700; font-variant-numeric:tabular-nums; }
    input[type=range] { display:block; width:100%; height:28px; margin:10px 0 0; accent-color:var(--green); cursor:pointer; }
    .range-limits { display:flex; justify-content:space-between; color:var(--muted); font-size:16px; }
    .metrics { display:grid; grid-template-columns:1fr 0.65fr; gap:20px; background:var(--pale); border-radius:12px; padding:16px 22px; align-items:center; }
    .metric-value { font-size:60px; line-height:1.05; font-weight:730; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
    .metric-value small { font-size:30px; font-weight:450; letter-spacing:0; }
    .metric-label { font-size:20px; color:var(--muted); margin-top:7px; }
    .attempts { border-left:1px solid #abc8b9; padding-left:24px; }
    .attempts .metric-value { font-size:42px; }
    .bar-chart { display:grid; gap:8px; flex:1; align-content:center; min-height:0; }
    .bar-row { display:grid; grid-template-columns:98px 1fr 72px; align-items:center; gap:12px; font-size:20px; }
    .bar-row .value { text-align:right; font-variant-numeric:tabular-nums; }
    .bar-track { background:#edf1e9; height:15px; border-radius:4px; overflow:hidden; }
    .bar-fill { background:var(--green); height:100%; border-radius:4px; }
    .scale-note { font-size:17px; color:var(--muted); margin:0; }
    .zero { margin:0; font-size:25px; line-height:1.4; }
    .artifact-note { border-top:1px solid var(--line); padding-top:10px; margin:0; color:var(--muted); font-size:19px; }
    footer { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; padding-top:1px; }
    .takeaway { margin:0 0 9px; font-size:23px; font-weight:600; line-height:1.3; }
    .disclosure { margin:0; font-size:19px; line-height:1.3; color:var(--muted); }
    .repo { font-size:18px; line-height:1.4; text-align:right; color:var(--muted); white-space:nowrap; }
    .poster.portrait { width:1080px; height:1350px; padding:42px 48px 36px; gap:22px; }
    .portrait h1 { font-size:54px; }
    .portrait .subtitle { font-size:25px; margin-top:11px; }
    .portrait .comparison { grid-template-columns:1fr; grid-template-rows:auto 1fr; gap:20px; }
    .portrait .panel { padding:22px 28px; border-radius:16px; }
    .portrait .before .panel-label { font-size:20px; }
    .portrait .copy { font-size:28px; line-height:1.5; margin-top:16px; }
    .portrait .flow { margin-top:6px; }
    .portrait .evidence { margin-top:20px; gap:15px; }
    .portrait .evidence-row { grid-template-columns:166px 1fr; }
    .portrait .evidence p { font-size:30px; }
    .portrait .explorer { margin-top:18px; gap:14px; }
    .portrait footer { align-items:flex-start; flex-direction:column; gap:11px; }
    .portrait .repo { text-align:left; }
    .portrait .takeaway { font-size:25px; }
    .portrait .disclosure { font-size:20px; }
    .portrait .repo { font-size:19px; }
    [data-export=true] .toolbar { display:none; }
    [data-export=true] #stage { margin:0; transform:none!important; }
    [data-export=true] { background:var(--paper); }
    :focus-visible { outline:3px solid #aa6318; outline-offset:4px; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Showcase controls">
    <label><span id="language-label">Language</span><select id="language"><option value="en">English</option><option value="zh">简体中文</option></select></label>
    <label><span id="case-label">Example</span><select id="case"></select></label>
    <label><span id="format-label">Layout</span><select id="format"><option value="landscape">1600 × 1000</option><option value="portrait">1080 × 1350</option></select></label>
    <a id="full-demo" href="../../examples/retry-backoff.html">Open the full retry explorer</a>
    <p id="toolbar-note">These are editorial examples, not measured before/after model results. The retry controls below work.</p>
  </nav>
  <main id="stage"></main>
  <script>
    const COPY = {
      en: {
        series:'WORDS → STRUCTURE → EXPLORATION', subtitle:'The same information, in a form you can inspect.',
        before:'BEFORE', after:'AFTER', prose:'Prose', disclosure:'Illustrative comparison · not a model benchmark',
        language:'Language', example:'Example', layout:'Layout', fullDemo:'Open the full retry explorer',
        toolbar:'These are editorial examples, not measured before/after model results. The retry controls below work.',
        cases:{
          release:{number:'01',title:'When can we deploy?',form:'Dependency diagram',
            before:'After the build completes, unit tests and the security scan run in parallel. Deploy only if both pass. Stop the release if either fails.',
            takeaway:'Both must pass. Either can stop the release.'},
          debugging:{number:'02',title:'What do we actually know?',form:'Evidence → hypothesis → check',
            before:'The request failed with <code>ECONNRESET</code>. A proxy may have closed the connection, but the cause is not confirmed. Check the proxy logs to test that hypothesis.',
            takeaway:'Keep the error exact. Keep the cause uncertain.'},
          retry:{number:'03',title:'What does one more retry cost?',form:'Interactive HTML preview',
            before:'Each retry waits twice as long as the previous one, starting at b seconds. For n retries, total waiting time is <span class="formula">b × (2ⁿ − 1)</span>. There are <span class="formula">n + 1</span> attempts. Execution time is excluded.',
            takeaway:'Change a parameter. Inspect the result.'}
        },
        flow:{build:'Build complete',parallel:'RUN IN PARALLEL',tests:'Unit tests',scan:'Security scan',pass:'Pass',fail:'Fail',stop:'Stop release',join:'Both passed',deploy:'Deploy'},
        evidence:{observed:'Observed',observation:'The request failed.',hypothesis:'Hypothesis',cause:'A proxy may have closed the connection.',unknown:'Cause not confirmed.',next:'Next check',check:'Inspect the proxy logs.'},
        retry:{base:'Base delay',retries:'Retries',wait:'Total waiting · execution excluded',attempts:'Total attempts',row:'Retry',zero:'0 retries → 0 s waiting, 1 initial attempt.',scale:'Bar scale',scaleTail:'adjusts to the longest wait',note:'Live controls in the HTML · PNG is a static preview',seconds:'seconds'}
      },
      zh: {
        series:'文字 → 结构 → 探索', subtitle:'同一份信息，换一种便于理解和核对的形式。',
        before:'BEFORE',after:'AFTER',prose:'文字说明',disclosure:'表达方式示例 · 非模型效果评测',
        language:'语言',example:'示例',layout:'版式',fullDemo:'打开完整的重试交互示例',
        toolbar:'这些是编排后的表达示例，并非模型前后效果实测。下面的重试参数可以实际调节。',
        cases:{
          release:{number:'01',title:'什么时候可以部署？',form:'依赖关系图',
            before:'构建完成后，单元测试和安全扫描并行进行。两者都通过才部署，任意一项失败就停止发布。',
            takeaway:'两项都通过，才允许部署。'},
          debugging:{number:'02',title:'我们到底知道什么？',form:'现象 → 假设 → 下一步',
            before:'请求失败，错误为 <code>ECONNRESET</code>。可能是代理关闭了连接，但原因尚未确认。需要查看代理日志，验证这个假设。',
            takeaway:'错误原文不变，假设仍然是假设。'},
          retry:{number:'03',title:'多重试一次，会多等多久？',form:'可操作的 HTML 预览',
            before:'首次重试前等待 b 秒，此后每次等待时间翻倍。重试 n 次，总等待时间为 <span class="formula">b × (2ⁿ − 1)</span>，总尝试次数为 <span class="formula">n + 1</span>。不计执行耗时。',
            takeaway:'改变参数，直接核对结果。'}
        },
        flow:{build:'构建完成',parallel:'并行执行',tests:'单元测试',scan:'安全扫描',pass:'通过',fail:'失败',stop:'停止发布',join:'两项都通过',deploy:'部署'},
        evidence:{observed:'已观察到',observation:'请求失败。',hypothesis:'待验证假设',cause:'可能是代理关闭了连接。',unknown:'原因尚未确认。',next:'下一步',check:'查看代理日志，验证假设。'},
        retry:{base:'基础等待',retries:'重试次数',wait:'总等待时间 · 不计执行耗时',attempts:'总尝试次数',row:'第',zero:'重试 0 次 → 等待 0 秒，仅初次尝试。',scale:'条形尺度',scaleTail:'随最长等待调整',note:'HTML 中可调节参数 · PNG 为静态预览',seconds:'秒'}
      }
    };
    const params=new URLSearchParams(location.search);
    let language=params.get('lang')==='zh'?'zh':'en';
    let selectedCase=['release','debugging','retry'].includes(params.get('case'))?params.get('case'):'release';
    let format=params.get('format')==='portrait'?'portrait':'landscape';
    document.body.dataset.export=String(params.get('export')==='1');
    const stage=document.getElementById('stage');
    function flow(c) {
      return `<svg class="flow" viewBox="0 0 720 450" role="img" aria-labelledby="flow-title flow-desc">
        <title id="flow-title">${c.build}: ${c.tests} + ${c.scan}</title>
        <desc id="flow-desc">${COPY[language].cases.release.before}</desc>
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0b6556"/></marker><marker id="fail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#983e32"/></marker></defs>
        <rect x="245" y="8" width="230" height="54" rx="10" fill="#e7f1e9" stroke="#a8c3b3"/><text x="360" y="36">${c.build}</text>
        <path d="M360 62 V92 H180 V130 M360 92 H540 V130" stroke="#0b6556" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
        <path d="M180 92 V130" stroke="#0b6556" stroke-width="3" marker-end="url(#arrow)"/>
        <text class="note" x="360" y="112">${c.parallel}</text>
        <rect x="70" y="140" width="220" height="62" rx="10" fill="#fffefa" stroke="#a8c3b3" stroke-width="2"/><text x="180" y="172">${c.tests}</text>
        <rect x="430" y="140" width="220" height="62" rx="10" fill="#fffefa" stroke="#a8c3b3" stroke-width="2"/><text x="540" y="172">${c.scan}</text>
        <path d="M225 202 V244 H305 V286 M495 202 V244 H415 V286" fill="none" stroke="#0b6556" stroke-width="3" marker-end="url(#arrow)"/>
        <path d="M305 244 V286" stroke="#0b6556" stroke-width="3" marker-end="url(#arrow)"/>
        <text class="edge-label" x="265" y="223">${c.pass}</text><text class="edge-label" x="455" y="223">${c.pass}</text>
        <path d="M110 202 V284 M610 202 V284" fill="none" stroke="#983e32" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#fail-arrow)"/>
        <path d="M110 255 V284" stroke="#983e32" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#fail-arrow)"/>
        <text class="edge-label stop-label" x="145" y="247">${c.fail}</text><text class="edge-label stop-label" x="650" y="247">${c.fail}</text>
        <rect x="25" y="292" width="170" height="56" rx="10" fill="#fbede6" stroke="#d9ad9e"/><text class="stop-label" x="110" y="322">${c.stop}</text>
        <rect x="525" y="292" width="170" height="56" rx="10" fill="#fbede6" stroke="#d9ad9e"/><text class="stop-label" x="610" y="322">${c.stop}</text>
        <rect x="240" y="294" width="240" height="56" rx="10" fill="#e7f1e9" stroke="#a8c3b3"/><text x="360" y="323">${c.join}</text>
        <path d="M360 350 V384" stroke="#0b6556" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="270" y="392" width="180" height="50" rx="10" fill="#0b6556"/><text class="white" x="360" y="418">${c.deploy}</text>
      </svg>`;
    }
    function evidence(c) {
      return `<div class="evidence"><div class="evidence-row"><h2>${c.observed}</h2><div><p>${c.observation}</p><code>ECONNRESET</code></div></div><div class="evidence-row"><h2>${c.hypothesis}</h2><div><p>${c.cause}</p><p class="unknown">${c.unknown}</p></div></div><div class="evidence-row"><h2>${c.next}</h2><p>${c.check}</p></div></div>`;
    }
    function explorer(c) {
      return `<div class="explorer"><div class="inputs"><div><div class="input-label"><label for="base">${c.base}</label><output id="base-value" for="base">1 s</output></div><input id="base" type="range" min="0.5" max="3" step="0.5" value="1"><div class="range-limits"><span>0.5 s</span><span>3 s</span></div></div><div><div class="input-label"><label for="retries">${c.retries}</label><output id="retry-value" for="retries">3</output></div><input id="retries" type="range" min="0" max="5" step="1" value="3"><div class="range-limits"><span>0</span><span>5</span></div></div></div><div class="metrics"><div><div class="metric-value"><span id="total">7</span> <small>s</small></div><div class="metric-label">${c.wait}</div></div><div class="attempts"><div class="metric-value" id="attempts">4</div><div class="metric-label">${c.attempts}</div></div></div><div id="bars" class="bar-chart" aria-label="${c.wait}"></div><p id="scale" class="scale-note"></p><p class="artifact-note">${c.note}</p><span id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden"></span></div>`;
    }
    function updateRetry() {
      const c=COPY[language].retry, base=Number(document.getElementById('base').value), retries=Number(document.getElementById('retries').value);
      const waits=Array.from({length:retries},(_,k)=>base*2**k);
      const total=waits.reduce((a,b)=>a+b,0), maximum=waits.at(-1)||0;
      document.getElementById('base-value').textContent=`${base} s`;
      document.getElementById('retry-value').textContent=String(retries);
      document.getElementById('base').setAttribute('aria-valuetext',`${base} ${c.seconds}`);
      document.getElementById('total').textContent=String(total);
      document.getElementById('attempts').textContent=String(retries+1);
      document.getElementById('bars').innerHTML=waits.length?waits.map((wait,k)=>`<div class="bar-row"><span>${language==='zh'?`第 ${k+1} 次`:`Retry ${k+1}`}</span><div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${wait/maximum*100}%"></div></div><span class="value">${wait} s</span></div>`).join(''):`<p class="zero">${c.zero}</p>`;
      document.getElementById('scale').textContent=`${c.scale}: 0–${maximum} s · ${c.scaleTail}`;
      document.getElementById('live').textContent=`${c.wait}: ${total} s. ${c.attempts}: ${retries+1}.`;
    }
    function fitPreview() {
      if(document.body.dataset.export==='true') return;
      const width=format==='portrait'?1080:1600;
      const scale=Math.min(1,(innerWidth-24)/width);
      stage.style.width=`${width}px`;
      stage.style.zoom=scale;
      stage.style.marginBottom='24px';
    }
    function render() {
      const c=COPY[language], item=c.cases[selectedCase];
      document.documentElement.lang=language==='zh'?'zh-CN':'en';
      document.getElementById('language').value=language;
      document.getElementById('case').innerHTML=Object.entries(c.cases).map(([key,value])=>`<option value="${key}">${value.number} · ${value.title}</option>`).join('');
      document.getElementById('case').value=selectedCase;
      document.getElementById('format').value=format;
      document.getElementById('language-label').textContent=c.language;
      document.getElementById('case-label').textContent=c.example;
      document.getElementById('format-label').textContent=c.layout;
      document.getElementById('full-demo').textContent=c.fullDemo;
      document.getElementById('toolbar-note').textContent=c.toolbar;
      const after=selectedCase==='release'?flow(c.flow):selectedCase==='debugging'?evidence(c.evidence):explorer(c.retry);
      stage.innerHTML=`<article class="poster ${format}" aria-label="${item.title}"><div class="brand-row"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>CLEAR OUTPUT</div><span class="series">${c.series} &nbsp; ${item.number}/03</span></div><header><h1>${item.title}</h1><p class="subtitle">${c.subtitle}</p></header><div class="comparison"><section class="panel before"><div class="panel-label"><b>${c.before}</b>${c.prose}</div><p class="copy">${item.before}</p></section><section class="panel after"><div class="panel-label"><b>${c.after}</b>${item.form}</div>${after}</section></div><footer><div><p class="takeaway">${item.takeaway}</p><p class="disclosure">${c.disclosure}</p></div><div class="repo">github.com/Jiansen/<br>clear-output-skill</div></footer></article>`;
      if(selectedCase==='retry') {
        document.getElementById('base').addEventListener('input',updateRetry);
        document.getElementById('retries').addEventListener('input',updateRetry);
        updateRetry();
      }
      fitPreview();
    }
    document.getElementById('language').addEventListener('change',e=>{language=e.target.value;render();});
    document.getElementById('case').addEventListener('change',e=>{selectedCase=e.target.value;render();});
    document.getElementById('format').addEventListener('change',e=>{format=e.target.value;render();});
    window.addEventListener('resize',fitPreview);
    render();
  </script>
</body>
</html>
